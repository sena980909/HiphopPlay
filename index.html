<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>국힙 플레이 — K-HipHop AI DJ</title>
<link rel="icon" type="image/jpeg" href="/icon.jpg" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap');

  :root { --neon: #4ade80; --neon-dim: #22c55e; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── 네온 글로우 효과 ── */
  .neon-text {
    color: var(--neon);
    text-shadow: 0 0 8px rgba(74,222,128,0.3);
  }

  .neon-border {
    border: 1px solid var(--neon);
  }

  .neon-btn {
    background: transparent;
    border: 2px solid var(--neon);
    color: var(--neon);
    transition: all 0.3s ease;
  }
  .neon-btn:hover {
    background: var(--neon);
    color: #000;
    text-shadow: none;
  }
  .neon-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .neon-btn:disabled:hover {
    background: transparent;
    color: var(--neon);
  }

  /* ── 배경 그리드 ── */
  .grid-bg {
    position: fixed; inset: 0; z-index: -1;
    background-image:
      linear-gradient(rgba(74,222,128,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,222,128,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* ── LP 스피너 ── */
  .lp-spinner {
    width: 100px; height: 100px;
    border-radius: 50%;
    background:
      radial-gradient(circle at center, #111 18%, transparent 19%),
      repeating-radial-gradient(circle at center,
        transparent 0px, transparent 8px,
        rgba(74,222,128,0.06) 9px, transparent 10px),
      conic-gradient(from 0deg, #1a1a1a, #222, #1a1a1a, #222, #1a1a1a);
    border: 2px solid var(--neon);
    animation: spin 2s linear infinite;
  }
  .lp-spinner::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--neon);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 카드 ── */
  .track-card {
    background: rgba(17,17,17,0.85);
    border: 1px solid rgba(74,222,128,0.12);
    backdrop-filter: blur(4px);
    transition: all 0.3s ease;
  }
  .track-card:hover {
    border-color: var(--neon);
    transform: translateY(-2px);
  }

  /* ── 유튜브 버튼 ── */
  .yt-btn {
    background: rgba(255,0,0,0.15);
    border: 1px solid rgba(255,0,0,0.4);
    color: #ff4444;
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 4px;
    transition: all 0.3s ease;
    text-decoration: none;
    white-space: nowrap;
  }
  .yt-btn:hover {
    background: #ff0000;
    color: #fff;
    border-color: #ff0000;
  }

  /* ── 인풋 ── */
  .mood-input {
    background: rgba(20,20,20,0.9);
    border: 1px solid rgba(74,222,128,0.2);
    color: #e0e0e0;
    caret-color: var(--neon);
    transition: all 0.3s ease;
  }
  .mood-input:focus {
    outline: none;
    border-color: var(--neon);
  }
  .mood-input::placeholder { color: rgba(74,222,128,0.3); }

  /* ── 페이드인 애니메이션 ── */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-in-up {
    animation: fadeInUp 0.5s ease forwards;
    opacity: 0;
  }

  /* ── 프리셋 칩 ── */
  .chip {
    background: rgba(74,222,128,0.06);
    border: 1px solid rgba(74,222,128,0.2);
    color: rgba(74,222,128,0.7);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
  }
  .chip:hover {
    background: rgba(74,222,128,0.12);
    border-color: var(--neon);
    color: var(--neon);
  }

  /* ── 스크롤바 ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0a0a0a; }
  ::-webkit-scrollbar-thumb { background: rgba(74,222,128,0.3); border-radius: 3px; }

  .title-font { font-family: 'Black Han Sans', sans-serif; }
</style>
</head>
<body>

<div class="grid-bg"></div>

<!-- ══════════════ HEADER ══════════════ -->
<header class="text-center pt-10 pb-6 px-4">
  <h1 class="title-font text-4xl md:text-6xl neon-text tracking-wide">국힙 플레이</h1>
  <p class="mt-3 text-sm md:text-base text-gray-500 max-w-md mx-auto">
    AI DJ에게 기분을 말해봐. 국힙 명곡 5트랙을 틀어줄게.
  </p>
</header>

<!-- ══════════════ INPUT SECTION ══════════════ -->
<main class="max-w-2xl mx-auto px-4 pb-20">

  <!-- 프리셋 칩 -->
  <div class="flex flex-wrap gap-2 justify-center mb-5" id="presets">
    <button class="chip" onclick="setMood('새벽감성, 혼술할 때')">🌙 새벽 혼술</button>
    <button class="chip" onclick="setMood('운동할 때 빡세게')">🔥 운동 부스터</button>
    <button class="chip" onclick="setMood('드라이브 밤거리')">🚗 밤 드라이브</button>
    <button class="chip" onclick="setMood('자존감 올릴 때 플렉스')">💎 플렉스</button>
    <button class="chip" onclick="setMood('비오는 날 우울할 때')">🌧️ 비오는 날</button>
    <button class="chip" onclick="setMood('헤어지고 분노할 때')">💔 이별 후 분노</button>
  </div>

  <!-- 입력 폼 -->
  <div class="flex gap-3 items-stretch">
    <input
      id="moodInput"
      type="text"
      class="mood-input flex-1 rounded-lg px-4 py-3 text-sm md:text-base"
      placeholder="지금 기분이 어때? (예: 새벽에 비 오는데 혼술 중)"
      maxlength="200"
      onkeydown="if(event.key==='Enter')recommend()"
    />
    <button id="goBtn" class="neon-btn rounded-lg px-5 py-3 font-bold text-sm md:text-base" onclick="recommend()">
      추천받기
    </button>
  </div>

  <!-- 로딩 -->
  <div id="loader" class="hidden flex flex-col items-center mt-14 gap-5">
    <div class="lp-spinner relative"></div>
    <p class="text-sm neon-text animate-pulse tracking-wider">DJ가 LP판을 고르는 중...</p>
  </div>

  <!-- 에러 메시지 -->
  <div id="errorMsg" class="hidden mt-6 text-center text-yellow-400 text-sm"></div>

  <!-- 결과 리스트 -->
  <div id="results" class="mt-8 space-y-3"></div>

  <!-- 푸터 -->
  <footer id="footer" class="hidden text-center mt-10 text-xs text-gray-600">
    Powered by Google Gemini · 아이돌 래퍼 제외, 리얼 국힙 only
  </footer>
</main>

<div class="text-center pb-6 text-xs text-gray-700">
  Made by 원이직
</div>

<script>
// ── 비상용 하드코딩 데이터(Fallback) ──
const FALLBACK_TRACKS = [
  { artist: "이센스", title: "의리", reason: "국힙의 정수, 어떤 기분에도 통하는 클래식." },
  { artist: "에픽하이", title: "우산", reason: "비 오는 날의 국민 힙합 발라드." },
  { artist: "빈지노", title: "Dali, Van, Picasso", reason: "감각적인 프로듀싱과 랩의 완벽한 조화." },
  { artist: "다이나믹 듀오", title: "죽일 놈", reason: "기분 전환엔 역시 이 곡." },
  { artist: "창모", title: "마에스트로 (Maestro)", reason: "밤하늘 아래 감성을 터뜨리는 명곡." }
];

// ── DOM ──
const moodInput  = document.getElementById('moodInput');
const goBtn      = document.getElementById('goBtn');
const loader     = document.getElementById('loader');
const errorMsg   = document.getElementById('errorMsg');
const results    = document.getElementById('results');
const footer     = document.getElementById('footer');

// ── 프리셋 입력 ──
function setMood(text) {
  moodInput.value = text;
  moodInput.focus();
}

// ── 메인 추천 함수 ──
async function recommend() {
  const mood = moodInput.value.trim();
  if (!mood) {
    moodInput.focus();
    moodInput.classList.add('!border-red-500');
    setTimeout(() => moodInput.classList.remove('!border-red-500'), 1500);
    return;
  }

  // UI 초기화
  goBtn.disabled = true;
  results.innerHTML = '';
  errorMsg.classList.add('hidden');
  errorMsg.textContent = '';
  footer.classList.add('hidden');
  loader.classList.remove('hidden');

  let tracks = null;

  try {
    const res = await fetch('/api/recommend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mood })
    });

    if (!res.ok) {
      throw new Error(`API 응답 오류: ${res.status}`);
    }

    const data = await res.json();
    tracks = data.tracks;

    if (!Array.isArray(tracks) || tracks.length === 0) {
      throw new Error('올바른 형식이 아닙니다.');
    }
  } catch (err) {
    console.warn('API 에러, 폴백 사용:', err);
    tracks = FALLBACK_TRACKS;
  }

  // 렌더링
  loader.classList.add('hidden');
  renderTracks(tracks);
  footer.classList.remove('hidden');
  goBtn.disabled = false;
}

// ── 트랙 리스트 렌더링 ──
function renderTracks(tracks) {
  results.innerHTML = '';

  tracks.forEach((track, i) => {
    const ytQuery = encodeURIComponent(`${track.artist} ${track.title}`);
    const ytUrl   = `https://music.youtube.com/search?q=${ytQuery}`;

    const card = document.createElement('div');
    card.className = 'track-card rounded-lg p-4 fade-in-up';
    card.style.animationDelay = `${i * 0.07}s`;

    card.innerHTML = `
      <div class="flex items-start justify-between gap-3">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-bold neon-text opacity-70">${String(i + 1).padStart(2, '0')}</span>
            <h3 class="font-bold text-white text-sm md:text-base truncate">${escapeHtml(track.title)}</h3>
          </div>
          <p class="text-xs md:text-sm text-gray-400 mb-1">${escapeHtml(track.artist)}</p>
          <p class="text-xs text-gray-500 leading-relaxed">${escapeHtml(track.reason)}</p>
        </div>
        <a href="${ytUrl}" target="_blank" rel="noopener noreferrer" class="yt-btn flex items-center gap-1 mt-1">
          ▶ YT Music
        </a>
      </div>
    `;

    results.appendChild(card);
  });
}

// ── HTML 이스케이프 ──
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
</script>

</body>
</html>
