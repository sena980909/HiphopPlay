  .neon-text { color:var(--neon); text-shadow:0 0 8px rgba(74,222,128,0.3); }
  .neon-btn { background:transparent; border:2px solid var(--neon); color:var(--neon); transition:all .3s ease; }
  .neon-btn:hover { background:var(--neon); color:#000; }
  .neon-btn:disabled { opacity:.4; cursor:not-allowed; }
  .neon-btn:disabled:hover { background:transparent; color:var(--neon); }
  .grid-bg { position:fixed; inset:0; z-index:-1; background-image:linear-gradient(rgba(74,222,128,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(74,222,128,0.02) 1px,transparent 1px); background-size:40px 40px; }

  .lp-spinner::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:12px; height:12px; border-radius:50%; background:var(--neon); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .track-card { background:rgba(17,17,17,0.85); border:1px solid rgba(74,222,128,0.12); backdrop-filter:blur(4px); transition:all .3s ease; }
  .track-card:hover { border-color:var(--neon); transform:translateY(-2px); }
  .yt-btn { background:rgba(255,0,0,0.15); border:1px solid rgba(255,0,0,0.4); color:#ff4444; font-size:.75rem; padding:4px 10px; border-radius:4px; transition:all .3s ease; text-decoration:none; white-space:nowrap; }
  .yt-btn:hover { background:#ff0000; color:#fff; border-color:#ff0000; }
  .mood-input { background:rgba(20,20,20,0.9); border:1px solid rgba(74,222,128,0.2); color:#e0e0e0; caret-color:var(--neon); transition:all .3s ease; }
  .mood-input:focus { outline:none; border-color:var(--neon); }
  .mood-input::placeholder { color:rgba(74,222,128,0.3); }
  @keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .fade-in-up { animation:fadeInUp .5s ease forwards; opacity:0; }
  .chip { background:rgba(74,222,128,0.06); border:1px solid rgba(74,222,128,0.2); color:rgba(74,222,128,0.7); padding:6px 14px; border-radius:999px; font-size:.8rem; cursor:pointer; transition:all .25s ease; white-space:nowrap; }

  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:#0a0a0a; }
  ::-webkit-scrollbar-thumb { background:rgba(74,222,128,0.3); border-radius:3px; }

<header class="text-center pt-10 pb-6 px-4">

  <p class="mt-3 text-sm md:text-base text-gray-500 max-w-md mx-auto">

  </p>
</header>

<main class="max-w-2xl mx-auto px-4 pb-20">
  <div class="flex flex-wrap gap-2 justify-center mb-5" id="presets">
    <button class="chip" onclick="setMood('새벽 혼술 우울')">🌙 새벽 혼술</button>
    <button class="chip" onclick="setMood('운동 파워 에너지')">🔥 운동 부스터</button>

    <button class="chip" onclick="setMood('클럽 파티 술 밤')">🍾 파티</button>
  </div>

  <div class="flex gap-3 items-stretch">
    <input id="moodInput" type="text" class="mood-input flex-1 rounded-lg px-4 py-3 text-sm md:text-base"
      placeholder="지금 기분이 어때? (예: 상사 때문에 빡침)" maxlength="200"
      onkeydown="if(event.key==='Enter')recommend()" />
    <button id="goBtn" class="neon-btn rounded-lg px-5 py-3 font-bold text-sm md:text-base" onclick="recommend()">
      추천받기
    </button>
  </div>

  <div id="loader" class="hidden flex flex-col items-center mt-14 gap-5">
    <div class="lp-spinner relative"></div>
    <p class="text-sm neon-text animate-pulse tracking-wider">DJ가 LP판을 고르는 중...</p>
  </div>

  <div id="results" class="mt-8 space-y-3"></div>

  <footer id="footer" class="hidden text-center mt-10 text-xs text-gray-600">
    아이돌 래퍼 제외, 리얼 국힙 only
  </footer>
</main>

  "때문":["스트레스","답답","짜증","분노","빡침"],
  "짜증":["짜증","분노","빡침","스트레스","화","폭발"],

  "여행":["여행","비행기","바다","휴가","드라이브"]
};

// ── DOM ──
const moodInput=document.getElementById('moodInput');
const goBtn=document.getElementById('goBtn');
const loader=document.getElementById('loader');
const results=document.getElementById('results');
const footer=document.getElementById('footer');

function setMood(t){moodInput.value=t;moodInput.focus();}

// ── 키워드 추출 ──
function extractKeywords(input){
  const words=input.replace(/[^\uAC00-\uD7A3a-zA-Z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>0);
  const expanded=new Set();
  words.forEach(w=>{
    expanded.add(w);
    Object.keys(SYN).forEach(key=>{
      if(w.includes(key)||key.includes(w)){
        SYN[key].forEach(s=>expanded.add(s));
      }
    });
  });
  return [...expanded];
}

// ── 점수 매기기 ──
function scoreTracks(keywords){
  return T.map((track,i)=>{
    let score=0;
    keywords.forEach(kw=>{
      track.g.forEach(tag=>{
        if(tag===kw) score+=3;
        else if(tag.includes(kw)||kw.includes(tag)) score+=1;
      });
    });
    return {idx:i,score,rand:Math.random()};
  });
}

// ── 추천 ──
function recommend(){
  const mood=moodInput.value.trim();
  if(!mood){
    moodInput.focus();
    moodInput.classList.add('!border-red-500');
    setTimeout(()=>moodInput.classList.remove('!border-red-500'),1500);
    return;
  }

  goBtn.disabled=true;
  results.innerHTML='';
  footer.classList.add('hidden');
  loader.classList.remove('hidden');

  setTimeout(()=>{
    const keywords=extractKeywords(mood);
    let scored=scoreTracks(keywords);

    // 매칭되는 곡 필터 + 아티스트 중복 제거
    const matched=scored.filter(s=>s.score>0);

    let picks;
    if(matched.length===0){
      // 매칭 없으면 랜덤 10곡
      picks=scored.sort(()=>Math.random()-0.5).slice(0,10);
    } else {
      // 아티스트 중복 제거하여 풀 구성
      const seen=new Set();
      const pool=[];
      // 점수순 정렬
      matched.sort((a,b)=>b.score-a.score);
      for(const s of matched){
        const artist=T[s.idx].a.replace(/\(.*?\)/g,'').trim();
        if(!seen.has(artist)){
          seen.add(artist);
          pool.push(s);
        }
      }
      // 풀에서 가중 랜덤으로 10곡 뽑기 (점수 높을수록 확률↑, 하지만 매번 다르게)
      const chosen=[];
      const remain=[...pool];
      while(chosen.length<10&&remain.length>0){
        const weights=remain.map(s=>s.score+Math.random()*remain[0].score*0.7);
        let best=0;
        for(let i=1;i<weights.length;i++) if(weights[i]>weights[best]) best=i;
        chosen.push(remain.splice(best,1)[0]);
      }
      picks=chosen;
    }

    const tracks=picks.map(p=>T[p.idx]);

    loader.classList.add('hidden');
    renderTracks(tracks);
    footer.classList.remove('hidden');
    goBtn.disabled=false;
  },600);
}

// ── 렌더링 ──
function renderTracks(tracks){
  results.innerHTML='';
  tracks.forEach((track,i)=>{
    const q=encodeURIComponent(`${track.a.replace(/\(.*?\)/g,'')} ${track.t}`);
    const url=`https://music.youtube.com/search?q=${q}`;
    const card=document.createElement('div');
    card.className='track-card rounded-lg p-4 fade-in-up';
    card.style.animationDelay=`${i*0.07}s`;
    card.innerHTML=`
      <div class="flex items-start justify-between gap-3">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs font-bold neon-text opacity-70">${String(i+1).padStart(2,'0')}</span>
            <h3 class="font-bold text-white text-sm md:text-base truncate">${esc(track.t)}</h3>
          </div>
          <p class="text-xs md:text-sm text-gray-400 mb-1">${esc(track.a)}</p>
          <p class="text-xs text-gray-500">${track.g.map(t=>'#'+t).join(' ')}</p>
        </div>
        <a href="${url}" target="_blank" rel="noopener noreferrer" class="yt-btn flex items-center gap-1 mt-1">▶ YT Music</a>
      </div>`;
    results.appendChild(card);
  });
}

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
</script>
